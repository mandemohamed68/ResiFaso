name: Build Android Release Bundle (.aab & .apk)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle & Sync Capacitor
        run: npm run mobile:build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab) & Release APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Upload Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: resifaso-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: resifaso-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
